aid: r
name: R
description: >-
  R is a free, open-source programming language and statistical computing environment maintained by the R Core Team and
  supported by the R Foundation. It provides a wide variety of statistical and graphical techniques and is highly
  extensible through its package ecosystem on CRAN (Comprehensive R Archive Network), Bioconductor, and GitHub. R is
  widely used among statisticians, data scientists, and researchers for data analysis, visualization, and reproducible
  research.
